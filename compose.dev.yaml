name: novel-writer

services:
  database:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: novel_writer
      POSTGRES_USER: novel_writer
      POSTGRES_PASSWORD: novel_writer
    ports:
      - "127.0.0.1:${NOVEL_WRITER_DATABASE_PORT:-54329}:5432"
    volumes:
      - novel-writer-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel_writer -d novel_writer"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  novel-writer-postgres:

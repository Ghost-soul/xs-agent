[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-novel-writer"
version = "0.1.0"
description = "Human-in-the-loop long-form fiction writing system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "charset-normalizer==3.4.9",
  "ebooklib==0.19",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pyyaml==6.0.3",
  "python-docx==1.2.0",
  "sqlalchemy==2.0.41",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
  "tokenizers==0.22.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.4",
]

[tool.uv]
required-version = ">=0.8.3,<0.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: requires an explicitly configured PostgreSQL test database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/novel_writer"]

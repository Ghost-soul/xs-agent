# GHCR deployment: place this file beside .env, then run docker compose up -d.
name: ${NOVEL_WRITER_STACK:-novel-writer-server}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${NOVEL_WRITER_IMAGE:-ghcr.io/ghost-soul/xs-agent:latest}
    pull_policy: missing
    init: true
    logging: *logging
    # Compose must write environment-backed secrets before starting the container.
    # The image still runs as UID 10001 with root-owned application code.
    read_only: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=268435456,mode=1777
    environment:
      NOVEL_WRITER_PUBLIC_ORIGIN: ${NOVEL_WRITER_PUBLIC_ORIGIN:-http://localhost:8080}
      NOVEL_WRITER_WEB_USER: ${NOVEL_WRITER_WEB_USER:-author}
      NOVEL_WRITER_DATABASE_HOST: database
      NOVEL_WRITER_DATABASE_NAME: ${NOVEL_WRITER_DATABASE_NAME:-novel_writer}
      NOVEL_WRITER_DATABASE_USER: novel_writer
      NOVEL_WRITER_GENERATION_SHUTDOWN_GRACE_SECONDS: ${NOVEL_WRITER_GENERATION_SHUTDOWN_GRACE_SECONDS:-300}
    secrets:
      - database_password
      - web_password
    volumes:
      - application-data:/app/data
      - application-logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    # Run migrations on each container start, then hand signals to the web process.
    # Uses commands already provided by the published GHCR image.
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        python -B /app/deploy/entrypoint.py migrate
        exec python -B /app/deploy/entrypoint.py serve
    ports:
      - "${NOVEL_WRITER_BIND:-127.0.0.1}:${NOVEL_WRITER_HTTP_PORT:-8080}:8000"
    restart: unless-stopped
    stop_grace_period: ${NOVEL_WRITER_STOP_GRACE_PERIOD:-360s}
    healthcheck:
      test: [CMD, python, -B, /app/deploy/healthcheck.py]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  database:
    image: pgvector/pgvector:0.8.0-pg17
    logging: *logging
    environment:
      POSTGRES_DB: ${NOVEL_WRITER_DATABASE_NAME:-novel_writer}
      POSTGRES_USER: novel_writer
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U novel_writer -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  application-data:
  application-logs:
  database-data:

secrets:
  database_password:
    environment: NOVEL_WRITER_DATABASE_PASSWORD
  web_password:
    environment: NOVEL_WRITER_WEB_PASSWORD

name: Publish reader image

on:
  push:
    branches: [main]
    paths:
      - 'reader/**'
      - 'frontend/src/reader/**'
      - 'frontend/reader/**'
      - 'frontend/vite.reader.config.ts'
      - 'frontend/tsconfig.reader.json'
      - 'frontend/tsconfig.app.json'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'deploy/web.py'
      - 'deploy/healthcheck.py'
      - 'scripts/prepare_reader_context.py'
      - '.github/workflows/reader-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-reader-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare reader-only build context
        run: python3 scripts/prepare_reader_context.py --output "$RUNNER_TEMP/reader-public"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish reader
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ runner.temp }}/reader-public
          file: ${{ runner.temp }}/reader-public/reader/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ghost-soul/xs-agent:reader
            ghcr.io/ghost-soul/xs-agent:reader-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Ghost-soul/xs-agent
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Novel Reader
            org.opencontainers.image.description=Read-only library for the existing novel database
          cache-from: type=gha,scope=reader
          cache-to: type=gha,mode=max,scope=reader
